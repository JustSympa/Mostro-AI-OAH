# Docker Compose for full stack (backend + frontend) and Zetaris services

services:
  # Core services
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mostro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mostro}
      POSTGRES_DB: ${POSTGRES_DB:-mostro}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mostro} -d ${POSTGRES_DB:-mostro}"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 5s
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 3s
    networks:
      - internal

  # Application – combines FastAPI backend and static Next.js assets
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mostro}:${POSTGRES_PASSWORD:-mostro}@postgres:5432/${POSTGRES_DB:-mostro}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - internal
      - public

  # Zetaris services (example placeholders)
  zetaris-engine:
    image: zetaris/engine:latest
    restart: unless-stopped
    ports:
      - "${ZETARIS_ENGINE_PORT:-9000}:9000"
    environment:
      # Add any required environment vars for the engine here
      ENGINE_MODE: production
    networks:
      - internal

  zetaris-proxy:
    image: zetaris/proxy:latest
    restart: unless-stopped
    ports:
      - "${ZETARIS_PROXY_PORT:-9100}:9100"
    environment:
      # Proxy configuration – point to the engine service
      ENGINE_HOST: zetaris-engine
      ENGINE_PORT: 9000
    depends_on:
      zetaris-engine:
        condition: service_started
    networks:
      - internal

networks:
  internal:
    driver: bridge
  public:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
