# Single source of truth for the entire Mostro AI stack.
# Everything is built and launched from the repository root:
#
#   docker compose up -d --build
#
# Endpoints once up:
#   web -> http://localhost:3000      Next.js static export served by nginx
#   api -> http://localhost:8000      FastAPI (auth, profile, agent /sse, memory)
#          http://localhost:8000/docs OpenAPI docs
#   pg  -> localhost:5433             host-published for psql / DBeaver
#
# `web` is a pure static host: the browser calls the API directly using the
# NEXT_PUBLIC_API_URL baked in at build time, so that URL must be reachable
# from the host and allowed by the API's CORS_ALLOWED_ORIGINS.

name: mostro-ai-oah

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mostro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mostro}
      POSTGRES_DB: ${POSTGRES_DB:-mostro}
    ports:
      # Published for local tooling only. Container-internal port stays 5432,
      # which is what the api service connects to over the `internal` network.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mostro} -d ${POSTGRES_DB:-mostro}"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 5s
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 3s
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Compose-level values win over .env so container wiring is always correct.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mostro}:${POSTGRES_PASSWORD:-mostro}@postgres:5432/${POSTGRES_DB:-mostro}
      REDIS_URL: redis://redis:6379/0
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    extra_hosts:
      # Allows the container to reach host-run services (Zetaris :8888, the
      # Meterless LLM proxy :8088) via host.docker.internal instead of 127.0.0.1.
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 20s
    networks:
      - internal
      - public

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    networks:
      - public

networks:
  internal:
    driver: bridge
  public:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
