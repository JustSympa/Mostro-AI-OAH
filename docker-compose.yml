# Docker Compose for the FastAPI app + Postgres + Redis
# The root Dockerfile builds the Next.js frontend as static assets and copies them
# into the final app image, where FastAPI serves them on the same port.

name: mostro-ai-oah

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mostro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mostro}
      POSTGRES_DB: ${POSTGRES_DB:-mostro}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mostro} -d ${POSTGRES_DB:-mostro}"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 5s
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 3s
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mostro}:${POSTGRES_PASSWORD:-mostro}@postgres:5432/${POSTGRES_DB:-mostro}
      REDIS_URL: redis://redis:6379/0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 20s
    networks:
      - internal
      - public

networks:
  internal:
    driver: bridge
  public:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
