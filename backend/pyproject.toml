    [build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mostro-auth"
version = "0.1.0"
description = "User management and authentication API for a trading application"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "sse-starlette>=3.0.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "pgvector>=0.3.6",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "argon2-cffi>=23.1.0",
    "pyotp>=2.9.0",
    "google-auth[requests]>=2.36.0",
    "PyJWT>=2.10.0",
    "cryptography>=44.0.0",
    "slowapi>=0.1.9",
    "redis>=5.2.0",
    "zxcvbn>=4.4.28",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
    "qrcode>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
